<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | Marketplace</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body>
  <main class="page center">
    <section class="card small">
      <header class="card-header">
        <div class="logo">🔒</div>
        <h1>Set a new password</h1>
        <p>Choose a strong password you have not used before.</p>
      </header>

      <form id="resetForm" novalidate>
        <div class="field">
          <label for="password">New password</label>
          <div class="pass-wrap">
            <input type="password" id="password" name="password" placeholder="Min. 8 characters" autocomplete="new-password" />
            <button type="button" class="toggle-pass" data-target="password" aria-label="Show password">👁</button>
          </div>
          <span class="error"></span>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <div class="pass-wrap">
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat password" autocomplete="new-password" />
            <button type="button" class="toggle-pass" data-target="confirmPassword" aria-label="Show password">👁</button>
          </div>
          <span class="error"></span>
        </div>

        <button type="submit" class="btn" id="submitBtn">Reset password</button>
        <div class="form-message" id="formMessage" role="alert"></div>

        <p class="switch"><a href="login.html">← Back to log in</a></p>
      </form>
    </section>
  </main>

  <script src="../js/auth.js"></script>
</body>
</html>
