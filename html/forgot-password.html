<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | Marketplace</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body>
  <main class="page center">
    <section class="card small">
      <header class="card-header">
        <div class="logo">🔑</div>
        <h1>Forgot password?</h1>
        <p>Enter your email and we will send you a link to reset your password.</p>
      </header>

      <form id="forgotForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" />
          <span class="error"></span>
        </div>

        <button type="submit" class="btn" id="submitBtn">Send reset link</button>
        <div class="form-message" id="formMessage" role="alert"></div>

        <p class="switch"><a href="login.html">← Back to log in</a></p>
      </form>
    </section>
  </main>

  <script src="../js/auth.js"></script>
</body>
</html>
